name: Publish API image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/brennersta/happengo-api
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image:$GITHUB_SHA" backend
          docker push "$image:$GITHUB_SHA"
          docker tag "$image:$GITHUB_SHA" "$image:latest"
          docker push "$image:latest"
