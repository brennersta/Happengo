version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-updates:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-updates:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: monthly
    groups:
      all-updates:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: terraform
    directories:
      - /infra/envs/dev
      - /infra/modules/container-apps
      - /infra/modules/key-vault
      - /infra/modules/log-analytics
      - /infra/modules/postgres
      - /infra/modules/storage
    schedule:
      interval: monthly
    groups:
      all-updates:
        patterns: ["*"]
    open-pull-requests-limit: 2
