version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm stays commented out on purpose.
  # Dependabot errors when the configured directory has no manifest.
  # There is no package.json or pnpm-lock.yaml yet.
  # The npm ecosystem is what Dependabot uses for a pnpm lockfile
  # (ADR 0002). Point it at the workspace root (/), not at each package.
  #
  # - package-ecosystem: npm
  #   directory: /
  #   schedule:
  #     interval: weekly

  # Happengo.sln is at /backend. The API and test projects live under it.
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly

  # One entry per Terraform root and module. Dependabot does not recurse
  # from /infra, and each directory has its own .terraform.lock.hcl.
  - package-ecosystem: terraform
    directory: /infra/envs/dev
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/modules/container-apps
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/modules/key-vault
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/modules/log-analytics
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/modules/postgres
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/modules/storage
    schedule:
      interval: weekly
